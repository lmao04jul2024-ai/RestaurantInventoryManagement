openapi: 3.0.3
info:
  title: Restaurant Management API
  version: 1.0.0
  description: |
    Multi-tenant restaurant inventory, menu, ordering and review platform.
    Authenticated via JWT Bearer tokens; every request is isolated to the
    tenant resolved from the token (or an explicit `X-Tenant-ID` header /
    `tenantId` query parameter). This mirrors `packages/api/src/routes`
    (Week 18.4 documentation task).

    Authenticated responses use the `{ "data": … }` envelope; errors use
    `{ "error": { code, message, … } }` (see `ErrorEnvelope`).

servers:
  - url: http://localhost:3001
    description: Local API
  - url: https://api.example.com
    description: Production

tags:
  - name: Auth
  - name: Tenants
  - name: Users
  - name: Menus
  - name: Inventory
  - name: Suppliers
  - name: Purchase Orders
  - name: Orders
  - name: Reviews
  - name: Feature Flags
  - name: Staff
  - name: Audit
  - name: System

security:
  - bearerAuth: []

paths:
  /health:
    get:
      tags: [System]
      summary: Service health check
      security: []
      responses:
        "200":
          description: Service is healthy
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string, example: ok }
                  timestamp: { type: string, format: date-time }
  /:
    get:
      tags: [System]
      summary: Service metadata
      security: []
      responses:
        "200":
          description: Service name/version/status
          content:
            application/json:
              schema:
                type: object
                properties:
                  name: { type: string }
                  version: { type: string }
                  status: { type: string }

  # ── Auth ────────────────────────────────────────────────────────────────
  /api/auth/register:
    post:
      tags: [Auth]
      summary: Register a user (tenant context resolved where possible)
      security: []
      requestBody:
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RegisterRequest" }
      responses:
        "200": { description: Tokens + user }
        "400": { $ref: "#/components/responses/BadRequest" }
        "409": { $ref: "#/components/responses/Conflict" }
  /api/auth/login:
    post:
      tags: [Auth]
      summary: Exchange credentials for tokens
      security: []
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email: { type: string, format: email }
                password: { type: string }
                tenantId: { type: string, format: uuid }
      responses:
        "200":
          description: accessToken + refreshToken + user
        "401": { $ref: "#/components/responses/Unauthorized" }
  /api/auth/refresh:
    post:
      tags: [Auth]
      summary: Rotate an access token from a refresh token
      security: []
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required: [refreshToken]
              properties:
                refreshToken: { type: string }
      responses:
        "200": { description: New token pair }
        "401": { $ref: "#/components/responses/Unauthorized" }
  /api/auth/forgot-password:
    post:
      tags: [Auth]
      summary: Request a password reset email
      security: []
      responses:
        "202": { description: Reset email dispatched }
  /api/auth/reset-password:
    post:
      tags: [Auth]
      summary: Set a new password from a reset token
      security: []
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required: [token, password]
              properties:
                token: { type: string, minLength: 32 }
                password: { type: string, minLength: 8 }
      responses:
        "200": { description: Password updated }
        "400": { $ref: "#/components/responses/BadRequest" }
  /api/auth/logout:
    post:
      tags: [Auth]
      summary: Revoke the current session
      security: []
      responses:
        "204": { description: Session revoked }

  # ── Tenants ─────────────────────────────────────────────────────────────

  /api/tenants:
    post:
      tags: [Tenants]
      summary: Self-service onboarding — create a tenant + first ADMIN
      security: []
      requestBody:
        content:
          application/json:
            schema: { $ref: "#/components/schemas/OnboardingRequest" }
      responses:
        "201":
          description: Tenant, user, default menu and token pair
          content:
            application/json:
              schema:
                type: object
                properties:
                  user: { type: object }
                  tenant: { $ref: "#/components/schemas/Tenant" }
                  accessToken: { type: string }
                  refreshToken: { type: string }
        "400": { $ref: "#/components/responses/BadRequest" }
  /api/tenants/me:
    get:
      tags: [Tenants]
      summary: Resolved tenant profile with user count
      responses:
        "200":
          description: Tenant profile
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: "#/components/schemas/Tenant" }
        "404": { $ref: "#/components/responses/NotFound" }
    patch:
      tags: [Tenants]
      summary: Update tenant profile / config / billing / theme (MANAGER+)
      requestBody:
        content:
          application/json:
            schema: { $ref: "#/components/schemas/TenantUpdateRequest" }
      responses:
        "200": { description: Updated tenant profile }
        "400": { $ref: "#/components/responses/BadRequest" }
  /api/tenants/me/analytics:
    get:
      tags: [Tenants]
      summary: Aggregated usage + billing analytics (MANAGER+)
      parameters:
        - name: days
          in: query
          schema: { type: integer, minimum: 1, maximum: 365, default: 30 }
      responses:
        "200":
          description: Analytics window
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TenantAnalytics" }

  # ── Users ───────────────────────────────────────────────────────────────
  /api/users/me:
    get:
      tags: [Users]
      summary: Current user's profile
      responses:
        "200": { description: User profile }
    patch:
      tags: [Users]
      summary: Update own profile
      requestBody:
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UserUpdateRequest" }
      responses:
        "200": { description: Updated profile }
  /api/users/{id}:
    get:
      tags: [Users]
      summary: Look up a user (staff:read)
      parameters:
        - $ref: "#/components/parameters/IdParam"
      responses:
        "200": { description: User record }
        "404": { $ref: "#/components/responses/NotFound" }
# ── Menus ────────────────────────────────────────────────────────────────
  /api/menus:
    get:
      tags: [Menus]
      summary: List tenant menus (menu:read)
      responses:
        "200": { description: Menu list }
    post:
      tags: [Menus]
      summary: Create a menu (MANAGER+)
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name: { type: string, maxLength: 120 }
                description: { type: string, maxLength: 500 }
      responses:
        "201": { description: Created menu }
  /api/menus/items:
    get:
      tags: [Menus]
      summary: List menu items with filters (menu:read)
      parameters:
        - name: q
          in: query
          schema: { type: string }
        - name: categoryId
          in: query
          schema: { type: string, format: uuid }
        - name: available
          in: query
          schema: { type: boolean }
        - name: vegetarian
          in: query
          schema: { type: boolean }
        - name: vegan
          in: query
          schema: { type: boolean }
        - name: sort
          in: query
          schema: { type: string, enum: [name, price_asc, price_desc, newest] }
        - name: page
          in: query
          schema: { type: integer, default: 1 }
        - name: limit
          in: query
          schema: { type: integer, default: 20, maximum: 50 }
      responses:
        "200": { description: Paged item list }
    post:
      tags: [Menus]
      summary: Create a menu item (MANAGER+)
      responses:
        "201": { description: Created item }
  /api/menus/items/{id}/effective:
    get:
      tags: [Menus]
      summary: Resolve effective price at a point in time (menu:read)
      parameters:
        - $ref: "#/components/parameters/IdParam"
        - name: at
          in: query
          schema: { type: string, format: date-time }
      responses:
# ── Inventory ───────────────────────────────────────────────────────────
  /api/inventory/items:
    get:
      tags: [Inventory]
      summary: List inventory items (inventory:read)
      parameters:
        - name: q
          in: query
          schema: { type: string }
        - name: supplierId
          in: query
          schema: { type: string, format: uuid }
        - name: isActive
          in: query
          schema: { type: boolean }
        - name: lowStock
          in: query
          schema: { type: boolean }
        - name: page
          in: query
          schema: { type: integer, default: 1 }
        - name: limit
          in: query
          schema: { type: integer, default: 20, maximum: 100 }
      responses:
        "200":
          description: Paged inventory list
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Paged" }
    post:
      tags: [Inventory]
      summary: Create an inventory item (MANAGER+)
      requestBody:
        content:
          application/json:
            schema: { $ref: "#/components/schemas/InventoryCreateRequest" }
      responses:
        "201": { description: Created item }
        "409": { description: SKU already exists for this tenant }
  /api/inventory/items/{id}:
    get:
      tags: [Inventory]
      summary: Get one inventory item (inventory:read)
      parameters:
        - $ref: "#/components/parameters/IdParam"
      responses:
        "200": { description: Inventory item }
        "404": { $ref: "#/components/responses/NotFound" }
    patch:
      tags: [Inventory]
      summary: Update an inventory item (MANAGER+)
      parameters:
        - $ref: "#/components/parameters/IdParam"
      responses:
        "200": { description: Updated item }
    delete:
      tags: [Inventory]
      summary: Delete an inventory item (MANAGER+)
      parameters:
        - $ref: "#/components/parameters/IdParam"
      responses:
        "204": { description: Deleted }
  /api/inventory/items/{id}/transactions:
    get:
      tags: [Inventory]
      summary: Stock-movement ledger for an item (inventory:read)
      parameters:
        - $ref: "#/components/parameters/IdParam"
      responses:
        "200": { description: Transactions }
    post:
      tags: [Inventory]
      summary: Record a stock movement (inventory:update:stock)
      parameters:
        - $ref: "#/components/parameters/IdParam"
      requestBody:
        content:
          application/json:
            schema: { $ref: "#/components/schemas/StockTransactionRequest" }
      responses:
        "201": { description: Transaction + updated item }
        "409": { description: Would drive stock negative }
  /api/inventory/alerts/low-stock:
    get:
      tags: [Inventory]
      summary: Items at or below minStock (inventory:read)
      responses:
        "200": { description: Low-stock items }
  /api/inventory/reports/valuation:
    get:
      tags: [Inventory]
      summary: Stock valuation report (inventory:read)
      parameters:
        - name: asOf
          in: query
          schema: { type: string, format: date-time }
      responses:
        "200": { description: Valuation rows + total }
  /api/inventory/reports/consumption:
    get:
      tags: [Inventory]
      summary: Consumption report for a window (inventory:read)
      parameters:
        - name: from
          in: query
          required: true
          schema: { type: string, format: date }
        - name: to
          in: query
          required: true
          schema: { type: string, format: date }
      responses:
        "200": { description: Consumption rows }
        "200": { description: Effective price + applied rules }
  /api/menus/items/{id}:
    get:
      tags: [Menus]
      summary: Get one menu item (menu:read)
      parameters:
        - $ref: "#/components/parameters/IdParam"
      responses:
        "200": { description: Menu item }
        "404": { $ref: "#/components/responses/NotFound" }
    patch:
      tags: [Menus]
      summary: Update a menu item (MANAGER+)
      parameters:
        - $ref: "#/components/parameters/IdParam"
      responses:
        "200": { description: Updated item }
    delete:
      tags: [Menus]
      summary: Delete a menu item (MANAGER+)
      parameters:
        - $ref: "#/components/parameters/IdParam"
      responses:
        "204": { description: Deleted }
  /api/menus/{menuId}/categories:
    get:
      tags: [Menus]
      summary: List categories for a menu (menu:read)
      parameters:
        - $ref: "#/components/parameters/UuidMenuId"
      responses:
        "200": { description: Category tree }
    post:
      tags: [Menus]
      summary: Create a category (MANAGER+)
      parameters:
        - $ref: "#/components/parameters/UuidMenuId"
      responses:
        "201": { description: Created category }
  /api/menus/categories/{id}:
    patch:
      tags: [Menus]
      summary: Update a category (MANAGER+)
      parameters:
        - $ref: "#/components/parameters/IdParam"
      responses:
        "200": { description: Updated category }
    delete:
      tags: [Menus]
      summary: Delete a category (MANAGER+)
      parameters:
        - $ref: "#/components/parameters/IdParam"
      responses:
        "204": { description: Deleted }
# ── Suppliers ───────────────────────────────────────────────────────────
  /api/suppliers:
    get:
      tags: [Suppliers]
      summary: List suppliers (supplier:read)
      responses:
        "200": { description: Supplier list }
    post:
      tags: [Suppliers]
      summary: Create a supplier (MANAGER+)
      responses:
        "201": { description: Created supplier }
  /api/suppliers/{id}:
    get:
      tags: [Suppliers]
      summary: Get a supplier (supplier:read)
      parameters:
        - $ref: "#/components/parameters/IdParam"
      responses:
        "200": { description: Supplier }
        "404": { $ref: "#/components/responses/NotFound" }
    patch:
      tags: [Suppliers]
      summary: Update a supplier (MANAGER+)
      parameters:
        - $ref: "#/components/parameters/IdParam"
      responses:
        "200": { description: Updated supplier }
    delete:
      tags: [Suppliers]
      summary: Delete a supplier (MANAGER+)
      parameters:
        - $ref: "#/components/parameters/IdParam"
      responses:
        "204": { description: Deleted }
  /api/suppliers/{id}/items:
    get:
      tags: [Suppliers]
      summary: Inventory items sourced from a supplier (supplier:read)
      parameters:
        - $ref: "#/components/parameters/IdParam"
      responses:
        "200": { description: Items }

  # ── Purchase Orders ─────────────────────────────────────────────────────
  /api/purchase-orders:
    get:
      tags: [Purchase Orders]
      summary: List purchase orders
      responses:
        "200": { description: Purchase order list }
    post:
      tags: [Purchase Orders]
      summary: Create a draft purchase order
      responses:
        "201": { description: Created purchase order }
  /api/purchase-orders/{id}:
    get:
      tags: [Purchase Orders]
      summary: Get a purchase order
      parameters:
        - $ref: "#/components/parameters/IdParam"
      responses:
        "200": { description: Purchase order }
        "404": { $ref: "#/components/responses/NotFound" }
    patch:
      tags: [Purchase Orders]
      summary: Update a draft purchase order
      parameters:
        - $ref: "#/components/parameters/IdParam"
# ── Orders ───────────────────────────────────────────────────────────────
  /api/orders:
    get:
      tags: [Orders]
      summary: List orders (order:read / order:read:own)
      responses:
        "200": { description: Order list }
    post:
      tags: [Orders]
      summary: Create an order (order:create / order:create:own)
      requestBody:
        content:
          application/json:
            schema: { $ref: "#/components/schemas/OrderCreateRequest" }
      responses:
        "201": { description: Created order }
  /api/orders/kitchen:
    get:
      tags: [Orders]
      summary: KDS queue (order:read) — Week 21 rows carry assignedStaff, prepElapsedMinutes, prepTargetMet
      parameters:
        - name: status
          in: query
          schema: { $ref: "#/components/schemas/OrderStatus" }
          description: Narrow the board to a single live stage (21.2)
      responses:
        "200": { description: Kitchen queue split into live and scheduled-future tickets }
        "400": { $ref: "#/components/responses/BadRequest" }
  /api/orders/kitchen/analytics:
    get:
      tags: [Orders]
      summary: Prep-time analytics — avg prep, target-met share, throughput, per-status counts (order:read)
      parameters:
        - name: days
          in: query
          schema: { type: integer, minimum: 1, maximum: 30, default: 1 }
      responses:
        "200": { description: KitchenAnalytics }
        "400": { $ref: "#/components/responses/BadRequest" }
  /api/orders/kitchen/settings:
    get:
      tags: [Orders]
      summary: Effective kitchen settings (order:read) — defaults filled for absent values
      responses:
        "200": { description: KitchenSettings }
    patch:
      tags: [Orders]
      summary: Merge kitchen settings (MANAGER+) — prepTimeTargetMinutes 1-240, capacity 0-999 (0 disables the cap)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                prepTimeTargetMinutes: { type: integer, minimum: 1, maximum: 240 }
                capacity: { type: integer, minimum: 0, maximum: 999 }
      responses:
        "200": { description: Merged KitchenSettings }
        "400": { $ref: "#/components/responses/BadRequest" }
        "403": { $ref: "#/components/responses/Forbidden" }
  /api/orders/reports/summary:
    get:
      tags: [Orders]
      summary: Shift/service summary (MANAGER+)
      parameters:
        - name: from
          in: query
          schema: { type: string, format: date }
        - name: to
          in: query
          schema: { type: string, format: date }
      responses:
        "200": { description: Summary }
  /api/orders/stream:
    get:
      tags: [Orders]
      summary: SSE order-event stream (order:read)
      responses:
        "200":
          description: text/event-stream of tenant order events
  /api/orders/{id}:
    get:
      tags: [Orders]
      summary: Get one order (order:read / order:read:own)
      parameters:
        - $ref: "#/components/parameters/IdParam"
      responses:
        "200": { description: Order }
        "404": { $ref: "#/components/responses/NotFound" }
    patch:
      tags: [Orders]
      summary: Update an order (SERVER+)
      parameters:
        - $ref: "#/components/parameters/IdParam"
      responses:
        "200": { description: Updated order }
  /api/orders/{id}/status:
    patch:
      tags: [Orders]
      summary: Advance the order status (order:update:status)
      parameters:
        - $ref: "#/components/parameters/IdParam"
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required: [status]
              properties:
                status:
                  type: string
                  enum: [PENDING, CONFIRMED, PREPARING, READY, COMPLETED, CANCELLED]
      responses:
        "200": { description: Status updated }
  /api/orders/{id}/assign:
    post:
      tags: [Orders]
      summary: Assign a staff member to a ticket (order:assign — KITCHEN/MANAGER/ADMIN; 21.2)
      parameters:
        - $ref: "#/components/parameters/IdParam"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [staffId]
              properties:
                staffId: { type: string, format: uuid }
      responses:
        "200":
          description: Updated order with assignedStaff (id and name)
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: ORDER_CLOSED — terminal orders cannot be reassigned
    delete:
      tags: [Orders]
      summary: Clear the assignment (order:assign; 21.2)
      parameters:
        - $ref: "#/components/parameters/IdParam"
      responses:
        "200":
          description: Updated order with assignedStaff null
        "409":
          description: ORDER_NOT_ASSIGNED — nothing to clear
  /api/orders/{id}/cancel:
    post:
      tags: [Orders]
      summary: Cancel an order (SERVER+)
      parameters:
        - $ref: "#/components/parameters/IdParam"
      responses:
        "200": { description: Cancelled order }
  /api/orders/{id}/items/{itemId}/status:
    patch:
      tags: [Orders]
      summary: Update one order-item status (order:update:status)
      parameters:
        - $ref: "#/components/parameters/IdParam"
        - name: itemId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200": { description: Item status updated }
  /api/orders/{id}/pay:
    post:
      tags: [Orders]
      summary: Settle an order via the simulated gateway (order:create / own)
      parameters:
        - $ref: "#/components/parameters/IdParam"
      responses:
        "200": { description: Paid order }

  # ── Reviews ─────────────────────────────────────────────────────────────
  /api/reviews:
    get:
      tags: [Reviews]
      summary: List reviews for moderation (review:read / review:moderate)
      responses:
        "200": { description: Review list }
    post:
      tags: [Reviews]
      summary: Create a review for a completed order (feature-gated, review:create:own)
      requestBody:
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ReviewCreateRequest" }
      responses:
        "201": { description: Created review }
        "403": { description: customer_reviews feature disabled for this tenant }
  /api/reviews/me:
    get:
      tags: [Reviews]
      summary: My reviews (review:read:own)
      responses:
        "200": { description: My reviews }
  /api/reviews/{id}/visibility:
    patch:
      tags: [Reviews]
      summary: Toggle review visibility (review:moderate)
      parameters:
        - $ref: "#/components/parameters/IdParam"
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required: [isVisible]
              properties:
                isVisible: { type: boolean }
      responses:
        "200": { description: Visibility updated }
  /api/reviews/{id}:
    delete:
      tags: [Reviews]
      summary: Delete a review (MANAGER+)
      parameters:
        - $ref: "#/components/parameters/IdParam"
      responses:
        "204": { description: Deleted }
      responses:
        "200": { description: Updated purchase order }
    delete:
      tags: [Purchase Orders]
      summary: Delete a draft purchase order
      parameters:
        - $ref: "#/components/parameters/IdParam"
      responses:
        "204": { description: Deleted }
  /api/purchase-orders/{id}/submit:
    post:
      tags: [Purchase Orders]
      summary: Submit a purchase order (DRAFT → SENT)
      parameters:
        - $ref: "#/components/parameters/IdParam"
      responses:
        "200": { description: Submitted purchase order }
  /api/purchase-orders/{id}/cancel:
    post:
      tags: [Purchase Orders]
      summary: Cancel a purchase order
      parameters:
        - $ref: "#/components/parameters/IdParam"
      responses:
        "200": { description: Cancelled purchase order }
  /api/purchase-orders/{id}/receive:
    post:
      tags: [Purchase Orders]
      summary: Receive goods — creates RESTOCK transactions
      parameters:
        - $ref: "#/components/parameters/IdParam"
      responses:
        "200": { description: Received purchase order }
# ── Feature Flags ────────────────────────────────────────────────────────
  /api/feature-flags:
    get:
      tags: [Feature Flags]
      summary: List the global flag registry + per-tenant defaults (feature-flag:read)
      responses:
        "200": { description: Flag registry }
    post:
      tags: [Feature Flags]
      summary: Register a global feature flag (feature-flag:manage)
      responses:
        "201": { description: Created flag }
  /api/feature-flags/{id}:
    patch:
      tags: [Feature Flags]
      summary: Update a global flag (feature-flag:manage)
      parameters:
        - $ref: "#/components/parameters/IdParam"
      responses:
        "200": { description: Updated flag }
    delete:
      tags: [Feature Flags]
      summary: Delete a global flag (feature-flag:manage)
      parameters:
        - $ref: "#/components/parameters/IdParam"
      responses:
        "204": { description: Deleted }
  /api/feature-flags/config:
    get:
      tags: [Feature Flags]
      summary: Effective flag map for the resolved tenant
      responses:
        "200": { description: Effective map }
    patch:
      tags: [Feature Flags]
      summary: Persist per-tenant flag overrides (feature-flag:manage)
      requestBody:
        content:
          application/json:
            schema:
              type: object
              additionalProperties: { type: boolean }
      responses:
        "200": { description: Updated effective map }

  # ── Staff ───────────────────────────────────────────────────────────────
  /api/staff:
    get:
      tags: [Staff]
      summary: Staff directory with permission overrides (staff:read)
      responses:
        "200": { description: Staff directory }
    post:
      tags: [Staff]
      summary: Create a staff account (staff:manage)
      requestBody:
        content:
          application/json:
            schema: { $ref: "#/components/schemas/StaffCreateRequest" }
      responses:
        "201": { description: Created staff member }
  /api/staff/{id}:
    patch:
      tags: [Staff]
      summary: Edit staff profile / role / permission overrides (staff:manage)
      parameters:
        - $ref: "#/components/parameters/IdParam"
      requestBody:
        content:
          application/json:
            schema: { $ref: "#/components/schemas/StaffUpdateRequest" }
      responses:
        "200": { description: Updated staff member }
        "403": { description: ADMIN rows are immutable via this endpoint }

  # ── Audit ───────────────────────────────────────────────────────────────
  /api/audit-logs:
    get:
      tags: [Audit]
      summary: Filterable, paginated audit trail (ADMIN only)
      parameters:
        - name: page
          in: query
          schema: { type: integer, default: 1 }
        - name: limit
          in: query
          schema: { type: integer, default: 50, maximum: 100 }
        - name: action
          in: query
          schema: { type: string }
        - name: targetType
          in: query
          schema: { type: string }
      responses:
        "200": { description: Audit log page }
  # ── Analytics & reporting (Week 19) ─────────────────────────────────────
  /api/analytics/sales:
    get:
      tags: [Analytics]
      summary: Sales analytics — revenue, daily histograms, top items, peak hours (analytics:read)
      parameters:
        - name: days
          in: query
          schema: { type: integer, minimum: 1, maximum: 365, default: 30 }
      responses:
        "200":
          description: SalesReport
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: "#/components/schemas/SalesReport" }
  /api/analytics/inventory:
    get:
      tags: [Analytics]
      summary: Inventory analytics — valuation, low/dead stock, movers, supplier split (analytics:read)
      parameters:
        - name: days
          in: query
          schema: { type: integer, minimum: 1, maximum: 365, default: 30 }
      responses:
        "200":
          description: InventoryReport
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: "#/components/schemas/InventoryReport" }
  /api/analytics/customers:
    get:
      tags: [Analytics]
      summary: Customer behavior — new/active/returning, repeat rate, top customers (analytics:read)
      parameters:
        - name: days
          in: query
          schema: { type: integer, minimum: 1, maximum: 365, default: 30 }
      responses:
        "200":
          description: CustomerReport
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: "#/components/schemas/CustomerReport" }
  /api/analytics/export:
    get:
      tags: [Analytics]
      summary: Export a report as CSV (Excel) or PDF (analytics:read)
      parameters:
        - name: type
          in: query
          required: true
          schema: { type: string, enum: [sales, inventory, customers] }
        - name: format
          in: query
          schema: { type: string, enum: [csv, pdf], default: csv }
        - name: days
          in: query
          schema: { type: integer, minimum: 1, maximum: 365, default: 30 }
      responses:
        "200":
          description: Raw file (text/csv with UTF-8 BOM, or application/pdf)
          content:
            text/csv: {}
            application/pdf: {}
  /api/analytics/stream:
    get:
      tags: [Analytics]
      summary: Live today-analytics over SSE (revenueToday, ordersToday, activeOrders)
      responses:
        "200":
          description: text/event-stream of `analytics` events
  /api/analytics/templates:
    get:
      tags: [Analytics]
      summary: List saved report templates (analytics:read)
      responses:
        "200":
          description: Template list
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items: { $ref: "#/components/schemas/ReportTemplate" }
    post:
      tags: [Analytics]
      summary: Save a report template (MANAGER+)
      requestBody:
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ReportTemplateInput" }
      responses:
        "201": { description: Created template }
        "409": { description: A template with this name already exists }
  /api/analytics/templates/{id}:
    patch:
      tags: [Analytics]
      summary: Update a template (MANAGER+)
      parameters:
        - $ref: "#/components/parameters/IdParam"
      requestBody:
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ReportTemplateInput" }
      responses:
        "200": { description: Updated template }
        "404": { description: Not found in this tenant }
    delete:
      tags: [Analytics]
      summary: Delete a template (MANAGER+)
      parameters:
        - $ref: "#/components/parameters/IdParam"
      responses:
        "204": { description: Deleted }

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  parameters:
    IdParam:
      name: id
      in: path
      required: true
      description: Resource UUID
      schema: { type: string, format: uuid }
    UuidMenuId:
      name: menuId
      in: path
      required: true
      schema: { type: string, format: uuid }

  responses:
    BadRequest:
      description: Validation failed
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorEnvelope" }
    Unauthorized:
      description: Missing or invalid credentials
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorEnvelope" }
    Forbidden:
      description: Role/permission denied or feature disabled
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorEnvelope" }
    NotFound:
      description: Resource not found in the resolved tenant
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorEnvelope" }
    Conflict:
      description: Duplicate or conflicting state
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorEnvelope" }

  schemas:
    ErrorEnvelope:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code: { type: string, example: VALIDATION_ERROR }
            message: { type: string }
            details:
              type: array
              items:
                type: object
                properties:
                  field: { type: string }
                  message: { type: string }

    Paged:
      type: object
      properties:
        data: { type: array, items: {} }
        pagination:
          type: object
          properties:
            page: { type: integer }
            limit: { type: integer }
            total: { type: integer }
            totalPages: { type: integer }

    RegisterRequest:
      type: object
      required: [email, password, firstName, lastName]
      properties:
        email: { type: string, format: email, maxLength: 255 }
        password:
          type: string
          minLength: 8
          maxLength: 128
          description: Must include upper, lower and a digit
        firstName: { type: string, maxLength: 100 }
        lastName: { type: string, maxLength: 100 }
        phone: { type: string, maxLength: 20 }
        tenantId: { type: string, format: uuid }

    OnboardingRequest:
      type: object
      required: [restaurantName, firstName, lastName, email, password]
      properties:
        restaurantName: { type: string, minLength: 2, maxLength: 120 }
        firstName: { type: string, maxLength: 100 }
        lastName: { type: string, maxLength: 100 }
        email: { type: string, format: email }
        password: { type: string, minLength: 8 }
        timezone: { type: string, example: America/New_York }
        currency: { type: string, pattern: "^[A-Z]{3}$", example: USD }
        taxRate: { type: number, minimum: 0, maximum: 100 }

    UserUpdateRequest:
      type: object
      properties:
        firstName: { type: string, maxLength: 100 }
        lastName: { type: string, maxLength: 100 }
        phone: { type: string, maxLength: 20 }
        imageUrl: { type: string, format: uri, nullable: true }
    Tenant:
      type: object
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        slug: { type: string }
        email: { type: string, format: email, nullable: true }
        phone: { type: string, nullable: true }
        address: { type: string, nullable: true }
        timezone: { type: string }
        currency: { type: string }
        taxRate:
          type: number
          example: 8.875
        operatingHours:
          type: object
          nullable: true
          example: { monday: { open: "09:00", close: "22:00" } }
        plan:
          type: string
          enum: [TRIAL, BASIC, PRO, ENTERPRISE]
        subscriptionStatus:
          type: string
          enum: [TRIAL, ACTIVE, PAST_DUE, CANCELLED]
        seatsLimit: { type: integer }
        theme: { $ref: "#/components/schemas/TenantTheme" }
        features: { type: object, readOnly: true }
        isActive: { type: boolean }

    TenantTheme:
      type: object
      nullable: true
      required: [preset, mode]
      properties:
        preset: { type: string, enum: [classic, emerald, sunset, custom] }
        mode: { type: string, enum: [light, dark, system] }
        custom:
          type: object
          nullable: true
          properties:
            primary: { type: string, pattern: "^#[0-9a-fA-F]{6}$" }
            secondary: { type: string, pattern: "^#[0-9a-fA-F]{6}$" }
        branding:
          type: object
          nullable: true
          properties:
            logoUrl: { type: string, format: uri, maxLength: 500, nullable: true }
            fontFamily: { type: string, enum: [inter, georgia, trebuchet, mono], nullable: true }

    TenantUpdateRequest:
      type: object
      minProperties: 1
      properties:
        name: { type: string, minLength: 2, maxLength: 120 }
        email: { type: string, format: email, maxLength: 255, nullable: true }
        phone: { type: string, maxLength: 20, nullable: true }
        address: { type: string, maxLength: 500, nullable: true }
        timezone: { type: string, maxLength: 64 }
        currency: { type: string, pattern: "^[A-Z]{3}$" }
        taxRate: { type: number, minimum: 0, maximum: 100 }
        operatingHours:
          type: object
          nullable: true
          description: Day → { open, close } map; null clears it
        plan: { type: string, enum: [TRIAL, BASIC, PRO, ENTERPRISE] }
        subscriptionStatus: { type: string, enum: [TRIAL, ACTIVE, PAST_DUE, CANCELLED] }
        isActive: { type: boolean }
        theme: { $ref: "#/components/schemas/TenantTheme" }

    TenantAnalytics:
      type: object
      properties:
        windowDays: { type: integer }
        orders:
          type: object
          properties:
            total: { type: integer }
            inWindow: { type: integer }
            active: { type: integer }
        revenue:
          type: object
          properties:
            total: { type: number }
            inWindow: { type: number }
        customers:
          type: object
          properties:
            total: { type: integer }
            newInWindow: { type: integer }
        menu:
          type: object
          properties:
            items: { type: integer }
            available: { type: integer }
        inventory:
          type: object
          properties:
            lowStock: { type: integer }
        reviews:
          type: object
          properties:
            total: { type: integer }
            avgRating: { type: number }
        billing:
          type: object
          properties:
            plan: { type: string }
            subscriptionStatus: { type: string }
            seatsUsed: { type: integer }
            seatsLimit: { type: integer }

    SalesReport:
      type: object
      properties:
        windowDays: { type: integer }
        totals:
          type: object
          properties:
            orders: { type: integer }
            paidOrders: { type: integer }
            paidRevenue: { type: number }
            avgOrderValue: { type: number }
        byStatus: { type: object, additionalProperties: { type: integer } }
        revenueByDay:
          type: array
          items:
            type: object
            properties: { date: { type: string }, revenue: { type: number } }
        ordersByDay:
          type: array
          items:
            type: object
            properties: { date: { type: string }, orders: { type: integer } }
        topItems:
          type: array
          items:
            type: object
            properties:
              itemId: { type: string }
              name: { type: string }
              quantity: { type: integer }
              revenue: { type: number }
        peakHours:
          type: array
          items:
            type: object
            properties: { hour: { type: integer }, orders: { type: integer } }

    InventoryReport:
      type: object
      properties:
        windowDays: { type: integer }
        totals:
          type: object
          properties:
            items: { type: integer }
            activeItems: { type: integer }
            lowStock: { type: integer }
            valuation: { type: number }
            retailValue: { type: number }
            deadStock: { type: integer }
        lowStockItems:
          type: array
          items:
            type: object
            properties:
              id: { type: string }
              name: { type: string }
              sku: { type: string }
              currentStock: { type: number }
              minStock: { type: number }
              unit: { type: string }
        deadStockItems:
          type: array
          items:
            type: object
            properties: { id: { type: string }, name: { type: string }, sku: { type: string }, currentStock: { type: number } }
        topMovers:
          type: array
          items:
            type: object
            properties: { itemId: { type: string }, name: { type: string }, usage: { type: number } }
        supplierBreakdown:
          type: array
          items:
            type: object
            properties:
              supplierId: { type: string }
              name: { type: string }
              items: { type: integer }
              stockValue: { type: number }

    CustomerReport:
      type: object
      properties:
        windowDays: { type: integer }
        totals:
          type: object
          properties:
            customers: { type: integer }
            newInWindow: { type: integer }
            active: { type: integer }
            returning: { type: integer }
            repeatRatePct: { type: number }
            avgOrdersPerCustomer: { type: number }
        topCustomers:
          type: array
          items:
            type: object
            properties:
              customerId: { type: string }
              name: { type: string }
              orders: { type: integer }
              spend: { type: number }
        avgRating: { type: number }
        reviewCount: { type: integer }

    ReportTemplate:
      type: object
      properties:
        id: { type: string, format: uuid }
        name: { type: string, maxLength: 120 }
        type: { type: string, enum: [sales, inventory, customers] }
        config:
          type: object
          properties:
            days: { type: integer, minimum: 1, maximum: 365 }
            sections: { type: array, items: { type: string } }
        tenantId: { type: string, format: uuid }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }

    ReportTemplateInput:
      type: object
      required: [name, type]
      properties:
        name: { type: string, minLength: 1, maxLength: 120 }
        type: { type: string, enum: [sales, inventory, customers] }
        config:
          type: object
          properties:
            days: { type: integer, minimum: 1, maximum: 365, default: 30 }
            sections: { type: array, items: { type: string } }
    InventoryCreateRequest:
      type: object
      required: [name, sku, minStock]
      properties:
        name: { type: string, minLength: 1, maxLength: 200 }
        sku: { type: string, minLength: 1, maxLength: 64 }
        currentStock: { type: number, minimum: 0, default: 0 }
        minStock: { type: number, minimum: 0 }
        maxStock: { type: number, minimum: 0, nullable: true }
        unit: { type: string, enum: [KG, G, L, ML, UNIT, BOX], default: UNIT }
        costPrice: { type: number, minimum: 0, nullable: true }
        sellingPrice: { type: number, minimum: 0, nullable: true }
        supplierId: { type: string, format: uuid, nullable: true }
        isActive: { type: boolean, default: true }

    StockTransactionRequest:
      type: object
      required: [transactionType, quantity]
      properties:
        transactionType:
          type: string
          enum: [RESTOCK, USAGE, ADJUSTMENT, RETURN]
        quantity: { type: number, minimum: 0 }
        note: { type: string, maxLength: 500 }

    OrderCreateRequest:
      type: object
      required: [items]
      properties:
        items:
          type: array
          minItems: 1
          items:
            type: object
            required: [itemId, quantity]
            properties:
              itemId: { type: string, format: uuid }
              quantity: { type: number, minimum: 1 }
              specialRequests: { type: string }
        tableId: { type: string, format: uuid }
        orderType:
          type: string
          enum: [DINE_IN, TAKEAWAY, DELIVERY, CURBSIDE]

    ReviewCreateRequest:
      type: object
      required: [orderId, rating]
      properties:
        orderId: { type: string, format: uuid }
        rating: { type: integer, minimum: 1, maximum: 5 }
        comment: { type: string, maxLength: 2000 }

    StaffCreateRequest:
      type: object
      required: [email, password, firstName, lastName, role]
      properties:
        email: { type: string, format: email, maxLength: 255 }
        password: { type: string, minLength: 8, maxLength: 128 }
        firstName: { type: string, maxLength: 100 }
        lastName: { type: string, maxLength: 100 }
        role: { type: string, enum: [MANAGER, KITCHEN, SERVER] }

    StaffUpdateRequest:
      type: object
      minProperties: 1
      properties:
        firstName: { type: string, maxLength: 100 }
        lastName: { type: string, maxLength: 100 }
        role: { type: string, enum: [MANAGER, KITCHEN, SERVER] }
        permissionOverrides:
          type: object
          nullable: true
          additionalProperties: { type: boolean, nullable: true }
          description: Per-user override map; null clears all overrides

    AssignedStaff:
      type: object
      description: Week 21.2 — { id, name } projection of an order's assigned staff member
      properties:
        id: { type: string, format: uuid }
        name: { type: string }

    KitchenSettings:
      type: object
      description: Week 21.4/21.5 — kitchen tuning knobs (Tenant.settings.kitchen)
      properties:
        prepTimeTargetMinutes: { type: integer, minimum: 1, maximum: 240 }
        capacity: { type: integer, minimum: 0, maximum: 999, description: Soft cap of active tickets; 0 disables the guard }

    KitchenAnalytics:
      type: object
      description: Week 21.3 — prep-time analytics for the kitchen window
      properties:
        windowDays: { type: integer }
        completedCount: { type: integer }
        avgPrepMinutes: { type: number }
        prepTimeTargetMinutes: { type: integer }
        targetMetPct: { type: integer, minimum: 0, maximum: 100 }
        throughputPerHour: { type: number }
        countsByStatus:
          type: object
          additionalProperties: { type: integer }
